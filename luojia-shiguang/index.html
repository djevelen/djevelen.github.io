<body>

<section class="hero" aria-label="游戏介绍"><h1 class="liquid-title" aria-label="珞珈拾光"><span aria-hidden="true" data-text="珞珈拾光">珞珈拾光</span></h1></section>
<main id="game"><section class="map-panel" aria-label="校园地图"><div class="map-heading"><div><p class="map-title">武汉大学</p><span class="eyebrow">校园地图</span></div><span class="map-status" id="map-status" aria-live="polite">等待开始</span><div class="map-tools"><button id="zoom-out" aria-label="缩小地图">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大地图">＋</button><button id="reset-view">复位</button></div></div>
